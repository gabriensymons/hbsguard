name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-line }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-line: 22.x
            node-version: ^22.23.4
          - node-line: 24.x
            node-version: ^24.22.1
          - node-line: 26.x
            node-version: ^26.12.1

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        if: matrix.node-line == '24.x'
        shell: bash
        run: |
          manifest="$RUNNER_TEMP/hbsguard-pack.json"
          npm pack --dry-run --json > "$manifest"
          node - "$manifest" <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))[0];
          const actual = manifest.files.map(({ path }) => path).sort();
          const expected = [
            "LICENSE",
            "README.md",
            "bin/hbsguard.js",
            "package.json",
            "src/cli.js",
            "src/config.js",
            "src/files.js",
            "src/fixes.js",
            "src/formatters.js",
            "src/index.js",
            "src/lint-text.js",
            "src/linter.js",
            "src/parser.js",
            "src/presets.js",
            "src/rules/eol-last.js",
            "src/rules/indentation.js",
            "src/rules/index.js",
            "src/rules/linebreak-style.js",
            "src/rules/mustache-spacing.js",
            "src/rules/no-bare-builtin-block-helpers.js",
            "src/rules/no-invalid-bracket-path.js",
            "src/rules/no-trailing-spaces.js",
            "src/rules/partial-spacing.js",
            "src/source-code.js",
            "src/tokens.js",
            "src/traverse.js",
          ].sort();

          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error("Unexpected npm package manifest.");
            console.error({ actual, expected });
            process.exit(1);
          }
          NODE

  windows-fix:
    name: Windows Fix Mode (Node.js 24.x)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Fix Mode and CLI
        run: node --test test/fixes.test.js test/cli.test.js
