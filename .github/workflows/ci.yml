name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        if: matrix.node-version == '24.x'
        shell: bash
        run: |
          manifest="$RUNNER_TEMP/hbsguard-pack.json"
          npm pack --dry-run --json > "$manifest"
          node - "$manifest" <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))[0];
          const actual = manifest.files.map(({ path }) => path).sort();
          const expected = [
            "LICENSE",
            "README.md",
            "bin/hbsguard.js",
            "package.json",
            "src/cli.js",
            "src/config.js",
            "src/files.js",
            "src/formatters.js",
            "src/index.js",
            "src/linter.js",
            "src/parser.js",
            "src/presets.js",
            "src/rules/eol-last.js",
            "src/rules/indentation.js",
            "src/rules/index.js",
            "src/rules/linebreak-style.js",
            "src/rules/mustache-spacing.js",
            "src/rules/no-bare-builtin-block-helpers.js",
            "src/rules/no-invalid-bracket-path.js",
            "src/rules/no-trailing-spaces.js",
            "src/rules/partial-spacing.js",
            "src/source-code.js",
            "src/tokens.js",
            "src/traverse.js",
          ].sort();

          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error("Unexpected npm package manifest.");
            console.error({ actual, expected });
            process.exit(1);
          }
          NODE
